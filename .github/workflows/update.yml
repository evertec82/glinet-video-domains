name: Update video domains
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/**", "sources.json"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -v
      - run: python scripts/build.py
      - name: Commit changed list
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist/video-domains.txt
          git diff --cached --quiet || git commit -m "chore: update video domains"
          git push

